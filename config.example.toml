# Copier en config.toml (ignoré par git). Tout réglage absent prend la valeur par défaut de ambilight/config.py.
# Chaque réglage peut aussi être forcé par une variable d'environnement AMBI_<NOM> (ex. AMBI_HZ=20).

# capture = "h264"               # "h264" (défaut) ou "raw" (images brutes, sans ffmpeg : ralentit beaucoup une Fire Stick, voir README)
fire_ip   = "192.168.1.50"       # Fire TV (Paramètres > Mon Fire TV > Options pour les développeurs > Débogage ADB)
ruban_ip  = "192.168.1.60"       # ruban Govee (app Govee > Paramètres de l'appareil > Contrôle LAN)
adb_cle   = "adbkey"             # clé privée ADB, relative à CE fichier

# Optionnel : envoie une trame UDP (15 x RVB) à un récepteur de votre choix (2e ruban d'ambiance). "" = désactivé. Voir README.
flux_ip   = ""
# flux_port = 4011
# bas_segments = 15

# Service de contrôle HTTP : ajouter l'adresse de Home Assistant.
ctl_autorises = ["127.0.0.1", "192.168.1.10"]

# Position de chaque segment du ruban autour de l'écran : [s du centre, écart-type], dans l'ordre du ruban.
# s = coordonnée de périmètre : 0 = coin haut-gauche, 0-1 le haut (G->D), 1-2 le côté droit (H->B),
# 2-3 le bas (D->G), 3-4 le côté gauche (B->H). À MESURER (voir README, « Calibrate the segments »).
# Exemple ci-dessous : un H619A (15 segments) dont le ruban, trop long pour le tour, fait un aller-retour en haut.
segments = [
  [0.41, 0.14], [0.68, 0.14], [1.42, 0.30], [1.96, 0.20], [2.33, 0.16],
  [2.54, 0.16], [2.76, 0.18], [3.07, 0.22], [3.49, 0.20], [3.81, 0.22],
  [0.155, 0.14], [0.375, 0.12], [0.645, 0.12], [0.955, 0.14], [0.60, 0.16],
]

# Calibration LED (ajustable en direct avec : python -m ambilight.calibrer -c config.toml)
# gamma = [1.45, 1.45, 1.45]     # courbe gamma LED par canal (R, V, B) ou un seul nombre
# balance = [1.0, 1.0, 1.0]      # balance des blancs du ruban (R, V, B) si les blancs tirent sur une couleur
# jaune_v = 1.0                  # frein vert sur le jaune pur (ex. 0.90 si le jaune tire vers le vert)
# bleu_v = 0.09                  # ajout de vert sur le bleu pur si les LED bleues tirent sur le violet
# vibr_ok = 0.70                 # vibrance perceptuelle Oklab LCh (préserve la teinte)
# aud_attente = 0.012            # silence H.264 (s) avant injection AUD (augmenter si des images sont coupées)
# bas_gamma = [1.45, 1.45, 1.45] # gamma dédié au 2e ruban
# bas_balance = [1.0, 1.0, 1.0]  # balance dédiée au 2e ruban (vide = reprend `balance`)
